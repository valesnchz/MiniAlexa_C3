<text x="20" y="34" font-size="18" font-weight="700" fill="#111827">Etapa de salida: GPIO10 → filtro RC → volumen → LM386 → parlante</text>
<text x="20" y="56" font-size="12" fill="#6b7280">Todos los GND son comunes. La masa del parlante y del LM386 vuelve por su propio cable al pin GND de la C3 (masa en estrella).</text>
